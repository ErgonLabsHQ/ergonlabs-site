<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 80">
  <!-- Ergon Labs favicon: the sitting owl on its own (no tile). Dark owl for light browser chrome; light owl when
       the system is in dark mode, so it stays visible on either tab bar. Amber eyes in both. -->
  <style>
    .dk { fill: #1b1b1b; } .bd { fill: #2c2c2c; } .hd { fill: #363636; } .bl { fill: #ececec; }
    .wh { fill: #fafafa; } .br { stroke: #101010; } .bk { fill: #c4c4c4; } .ch { stroke: #2c2c2c; }
    @media (prefers-color-scheme: dark) {
      .dk { fill: #9c9c9c; } .bd { fill: #b5b5b5; } .hd { fill: #c8c8c8; } .bl { fill: #f4f4f4; }
      .wh { fill: #ffffff; } .br { stroke: #5e5e5e; } .bk { fill: #232323; } .ch { stroke: #b5b5b5; }
    }
  </style>
