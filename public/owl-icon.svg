  <path class="ch" d="M24 50l2 2 2-2M30 50l2 2 2-2M36 50l2 2 2-2M23.5 56l2 2 2-2M29.5 56l2 2 2-2M35.5 56l2 2 2-2" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
